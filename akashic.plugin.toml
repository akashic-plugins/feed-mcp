schema_version = 1
name = "feed"
version = "3.1.4"
api_version = 3
entrypoint = "plugin.py"

[[python]]
requirements = "mcp/requirements.txt"

[validation]
exclude_data_paths = [
  "feed_mcp.sqlite3",
  "feed_mcp.sqlite3-wal",
  "feed_mcp.sqlite3-shm",
  "source_scores.json",
  "feed_cache.db",
  "feed_cache.db-wal",
  "feed_cache.db-shm",
  "feed_mcp.runtime.log",
  "feed_mcp.runtime.log.1",
  "feed_mcp.runtime.log.2",
  "feed_mcp.runtime.log.3",
  "feed_source.runtime.log",
  "feed_source.runtime.log.1",
  "feed_source.runtime.log.2",
  "feed_source.runtime.log.3",
  ".feed-v2-migration.json",
]

[[mcp]]
name = "feed"
command = ["python", "mcp/run_mcp.py"]
required_tools = ["feed_manage", "feed_query"]
candidate_read_only_tools = []
candidate_env = {FEED_BACKEND = "recording"}
